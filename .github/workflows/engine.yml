name: engine

on:
  pull_request:
    paths:
      - "engine/**"
      - "web/**"
      - "configs/**"
      - ".github/workflows/engine.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "web/**"
      - "configs/**"
      - ".github/workflows/engine.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: engine
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run crucible eval --task oncall@1 --policy reference,graph_walk,do_nothing,shotgun --seeds 0-1 --concurrency 4 --out runs/ci

  docker:
    needs: [check, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: engine
      - run: uv sync --locked
      - run: scripts/docker_smoke.sh
        env:
          CRUCIBLE_GIT_COMMIT: ${{ github.sha }}
