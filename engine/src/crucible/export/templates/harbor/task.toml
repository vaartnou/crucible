schema_version = "1.4"

[task]
name = "@@TASK_NAME@@"
description = @@DESCRIPTION@@
authors = []
keywords = @@KEYWORDS@@

[metadata]
task_ref = "@@TASK_REF@@"
seed = @@SEED@@
engine_version = "@@ENGINE_VERSION@@"
git_commit = "@@GIT_COMMIT@@"
generator = "crucible export harbor"

[agent]
timeout_sec = @@AGENT_TIMEOUT_SEC@@

[verifier]
timeout_sec = 120.0

[verifier.env]
GRADE_TOKEN = "@@GRADE_TOKEN@@"

[environment]
build_timeout_sec = 900.0
@@DOCKER_IMAGE_LINE@@cpus = @@CPUS@@
memory_mb = @@MEMORY_MB@@
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "mcp-server"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []

[environment.env]

[solution.env]
CRUCIBLE_POLICY = "@@SOLUTION_POLICY@@"
SOLUTION_TOKEN = "@@SOLUTION_TOKEN@@"
