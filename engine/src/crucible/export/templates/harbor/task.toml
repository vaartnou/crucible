schema_version = "1.4"
artifacts = [
    { source = "/tmp/verification/episode.json", service = "mcp-server" },
]

[task]
name = "@@TASK_NAME@@"
description = @@DESCRIPTION@@
authors = []
keywords = @@KEYWORDS@@

[metadata]
task_ref = "@@TASK_REF@@"
seed = @@SEED@@
engine_version = "@@ENGINE_VERSION@@"
git_commit = "@@GIT_COMMIT@@"
generator = "crucible export harbor"

[agent]
timeout_sec = @@AGENT_TIMEOUT_SEC@@

[verifier]
environment_mode = "separate"
timeout_sec = 120.0

[verifier.env]
CRUCIBLE_VERIFY_TASK = "@@TASK_REF@@"
CRUCIBLE_VERIFY_SEED = "@@SEED@@"
CRUCIBLE_VERIFY_SALT = "@@SIDECAR_SALT@@"

[[verifier.collect]]
service = "mcp-server"
command = "python -m crucible.export.collect_episode"
timeout_sec = 90.0

[verifier.environment]
cpus = @@CPUS@@
memory_mb = @@MEMORY_MB@@
storage_mb = 10240
gpus = 0

[environment]
build_timeout_sec = 900.0
@@DOCKER_IMAGE_LINE@@cpus = @@CPUS@@
memory_mb = @@MEMORY_MB@@
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "mcp-server"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []

[environment.env]

[solution.env]
CRUCIBLE_POLICY = "@@SOLUTION_POLICY@@"
SOLUTION_TOKEN = "@@SOLUTION_TOKEN@@"
