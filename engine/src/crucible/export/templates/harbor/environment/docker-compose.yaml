# Merged on top of Harbor's base docker-compose config. Harbor configures `main`.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy

  mcp-server:
    image: "@@SIDECAR_IMAGE@@"
    environment:
      MODE: "sidecar"
      SIDECAR_TASK: "@@TASK_REF@@"
      SIDECAR_SEED: "@@SEED@@"
      SIDECAR_SALT: "@@SIDECAR_SALT@@"
      SOLUTION_TOKEN: "@@SOLUTION_TOKEN@@"
      SOLUTION_POLICY: "@@SOLUTION_POLICY@@"
      GRADE_TOKEN: "@@GRADE_TOKEN@@"
      RUNS_DIR: "/tmp/runs"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
