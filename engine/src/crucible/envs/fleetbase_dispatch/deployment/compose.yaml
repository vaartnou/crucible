services:
  database:
    image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    command: [mysqld, --skip-log-bin]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: fleetbase
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 2s
      timeout: 5s
      retries: 60
  cache:
    image: redis@sha256:aaf7c123077a5e45ab2328b5ef7e201b5720616efac498d55e65a7afbb96ae20
  application:
    build: .
    entrypoint: [docker-php-entrypoint]
    command: [sh, /opt/crucible/start.sh]
    environment:
      APP_KEY: ${FLEETBASE_APP_KEY:?Generate a private application key}
      CRUCIBLE_FLEETBASE_API_KEY: ${CRUCIBLE_FLEETBASE_API_KEY:?Generate a private API key}
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_URL: http://application:8000
      DATABASE_URL: mysql://root@database/fleetbase
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_DATABASE: fleetbase
      DB_USERNAME: root
      DB_PASSWORD: ''
      QUEUE_CONNECTION: sync
      THROTTLE_ENABLED: 'false'
      THROTTLE_TRACK_CONSUMERS: 'false'
      CACHE_DRIVER: redis
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      SESSION_DRIVER: file
      BROADCAST_DRIVER: log
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
      REGISTRY_PREINSTALLED_EXTENSIONS: 'true'
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
