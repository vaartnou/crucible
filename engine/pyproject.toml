[project]
name = "crucible"
version = "0.1.0"
description = "Deterministic interactive agent environments with MCP tools and Harbor export"
readme = "README.md"
authors = [
    { name = "Karl Vaartnou", email = "karl@vaartnou.eu" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
crucible = "crucible:main"

# Environments. A plugin package registers its own under the same group.
[project.entry-points."crucible.envs"]
guess = "crucible.envs.guess"
incident = "crucible.envs.incident"
last_siding = "crucible.envs.last_siding"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

# Environment tests live next to each environment but stay out of the wheel (and so out of the
# Harbor sidecar and solution).
[tool.uv.build-backend]
wheel-exclude = ["crucible/envs/*/tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "src/crucible/envs"]
